name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Testcontainers usa o Docker do runner para subir Postgres e Redis reais.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
      - run: pnpm build:web

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
